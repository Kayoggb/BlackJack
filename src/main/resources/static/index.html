<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="casino-room">
    <div class="logo-container">
        <img src="logo/Image.png" alt="Casino Logo" class="casino-logo">
    </div>
    <div class="table-container">
        <div class="table-rail"></div>
        
        <div class="table-surface">
            <div class="dealer-area">
                <div class="area-label">DEALER</div>
                <div class="value-display" id="dealer-value">0</div>
                <div class="cards" id="dealer-cards"></div>
            </div>

            <div class="table-center">
                <div class="table-logo">BLACKJACK</div>
            </div>

            <div class="player-area">
                <div class="area-label">SPIELER</div>
                <div class="value-display" id="player-value">0</div>
                <div class="cards" id="player-cards"></div>
            </div>
        </div>
        
        <div class="buttons">
            <button id="hit">Karte nehmen</button>
            <button id="stand">Halten</button>
            <button id="double">Verdoppeln</button>
            <button id="restart">Neues Spiel</button>
        </div>
    </div>

    <div class="money-display">
        <span class="money-amount" id="money-amount">500</span>
        <span class="money-currency">$</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
