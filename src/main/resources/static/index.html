<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="money">Geld: 500€</div>

<h1 class="title">BLACKJACK</h1>

<div class="game">

    <div class="dealer">
        <h2>Dealer <span id="dealer-value">(0)</span></h2>
        <div class="cards" id="dealer-cards"></div>
    </div>

    <div class="player">
        <h2>Du <span id="player-value">(0)</span></h2>
        <div class="cards" id="player-cards"></div>
    </div>

    <div class="buttons">
        <button id="hit">Karte nehmen</button>
        <button id="stand">Halten</button>

        <!-- ✅ NEU: Double-Button -->
        <button id="double">Verdoppeln</button>

        <button id="restart">Neues Spiel</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
